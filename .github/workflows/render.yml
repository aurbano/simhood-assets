# Pictures of the models a pull request touches. This runs the pull request's own code with a
# read-only token and no secrets; for outside contributors the owner approves each run first. What
# it uploads is untrusted: preview.yml checks every byte before anything is published.
name: render

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: render-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PR: ${{ github.event.pull_request.number }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  AUTHOR: ${{ github.event.pull_request.user.login }}

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the merge result
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          persist-credentials: false
      - name: Check out the base for before pictures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: head/tools/pnpm-lock.yaml
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: head/tools/package.json
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: head/tools/pnpm-lock.yaml
      - name: Install the tools
        run: pnpm --ignore-workspace --dir head/tools install --frozen-lockfile

      - name: Cache Chromium
        id: browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('head/tools/pnpm-lock.yaml') }}
      - name: Install Chromium
        run: pnpm --ignore-workspace --dir head/tools exec playwright install --only-shell --with-deps chromium

      # Only to learn which models the pull request affects and how the client reads them; this
      # report is for drawing, the verdict comes from check.yml. The Khronos validator is not needed for that.
      - name: Work out the affected models
        run: |
          uv run head/tools/validate.py --repo head --base base --pr --pr-author "$AUTHOR" \
            --no-gltf-validator --report report.json || true
          uv run head/tools/validate.py --repo base --no-gltf-validator --report base-report.json || true
          if [ -f report.json ]; then
            jq -r '[.models[] | select(.change != "deleted" and .factor != null) | .id] | join(",")' report.json > affected.txt
          else
            : > affected.txt
          fi
          echo "affected: $(cat affected.txt)"

      - name: Draw them
        run: |
          ids="$(cat affected.txt)"
          mkdir -p renders
          if [ -n "$ids" ]; then
            args=(--repo "$PWD/head" --report "$PWD/report.json" --out "$PWD/renders" --only "$ids")
            if [ -f base-report.json ]; then args+=(--base-repo "$PWD/base" --base-report "$PWD/base-report.json"); fi
            pnpm --ignore-workspace --dir head/tools render -- "${args[@]}"
          fi

      - name: Lay the pictures out flat
        run: uv run base/tools/pack_pictures.py --renders renders --dest upload --pr "$PR" --sha "$HEAD_SHA"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pictures
          path: upload/
          if-no-files-found: error
          retention-days: 7
